# SANAD — Netlify deployment (TanStack Start SSR)
# Docs: https://docs.netlify.com/build/frameworks/framework-setup-guides/tanstack-start/

[build]
  command = "npm run build"
  publish = "dist/client"
  functions = ".netlify/v1/functions"

[build.environment]
  NODE_VERSION = "22"

[dev]
  command = "npm run dev"
  port = 8080
  targetPort = 8080

# Hashed Vite assets — long cache (immutable filenames)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers for HTML and app routes (CSP enforced — Track C4)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.ipify.org; img-src 'self' data: blob: https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
